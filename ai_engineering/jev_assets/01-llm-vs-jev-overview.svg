<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3d3d3a}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple rect,.c-purple circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7} .c-purple text{fill:#3C3489}.c-teal rect,.c-teal circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56} .c-teal text{fill:#085041}.c-coral rect,.c-coral circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D} .c-coral text{fill:#712B13}.c-gray rect,.c-gray circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A} .c-gray text{fill:#444441}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><title>LLM versus Jev</title>
<text class="th" x="40" y="36">Traditional LLM: writes the answer word by word</text>
<g class="c-gray"><rect x="40" y="56" width="120" height="44" rx="6" stroke-width="0.5"/><text class="th" x="100" y="78" text-anchor="middle" dominant-baseline="central">Read input</text></g>
<line x1="160" y1="78" x2="178" y2="78" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
<rect x="180" y="62" width="40" height="32" rx="4" stroke-width="0.5"/><text class="ts" x="200" y="78" text-anchor="middle" dominant-baseline="central">I</text>
<rect x="226" y="62" width="40" height="32" rx="4" stroke-width="0.5"/><text class="ts" x="246" y="78" text-anchor="middle" dominant-baseline="central">think</text>
<rect x="272" y="62" width="40" height="32" rx="4" stroke-width="0.5"/><text class="ts" x="292" y="78" text-anchor="middle" dominant-baseline="central">this</text>
<rect x="318" y="62" width="40" height="32" rx="4" stroke-width="0.5"/><text class="ts" x="338" y="78" text-anchor="middle" dominant-baseline="central">is</text>
<rect x="364" y="62" width="40" height="32" rx="4" stroke-width="0.5"/><text class="ts" x="384" y="78" text-anchor="middle" dominant-baseline="central">…</text>
<rect x="410" y="62" width="40" height="32" rx="4" stroke-width="0.5"/><text class="ts" x="430" y="78" text-anchor="middle" dominant-baseline="central">so</text>
<rect x="456" y="62" width="40" height="32" rx="4" stroke-width="0.5"/><text class="ts" x="476" y="78" text-anchor="middle" dominant-baseline="central">bill</text>
<rect x="502" y="62" width="40" height="32" rx="4" stroke-width="0.5"/><text class="ts" x="522" y="78" text-anchor="middle" dominant-baseline="central">ing</text>
</g>
<line x1="542" y1="78" x2="560" y2="78" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="562" y="56" width="78" height="44" rx="6" stroke-width="0.5"/><text class="th" x="601" y="78" text-anchor="middle" dominant-baseline="central">Answer</text></g>
<text class="ts" x="40" y="128">Every orange box is one full trip through the model. Hundreds of trips = seconds.</text>
<text class="th" x="40" y="180">Jev: reads once, scores every allowed answer together</text>
<g class="c-gray"><rect x="40" y="228" width="120" height="44" rx="6" stroke-width="0.5"/><text class="th" x="100" y="250" text-anchor="middle" dominant-baseline="central">Read input</text></g>
<line x1="160" y1="250" x2="188" y2="250" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="190" y="200" width="170" height="100" rx="8" stroke-width="0.5"/><text class="th" x="275" y="240" text-anchor="middle" dominant-baseline="central">Score all options</text><text class="ts" x="275" y="262" text-anchor="middle" dominant-baseline="central">one trip only</text></g>
<line x1="360" y1="230" x2="398" y2="216" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="250" x2="398" y2="250" class="arr" marker-end="url(#arrow)"/>
<line x1="360" y1="270" x2="398" y2="284" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="400" y="202" width="240" height="28" rx="4" stroke-width="1"/><text class="th" x="414" y="216" dominant-baseline="central">billing  94%</text></g>
<g class="c-gray"><rect x="400" y="236" width="240" height="28" rx="4" stroke-width="0.5"/><text class="t" x="414" y="250" dominant-baseline="central">refund  4%</text></g>
<g class="c-gray"><rect x="400" y="270" width="240" height="28" rx="4" stroke-width="0.5"/><text class="t" x="414" y="284" dominant-baseline="central">spam  2%</text></g>
<text class="ts" x="40" y="330">No writing, no waiting. The answer is picked from your list, not typed out.</text>
</svg>
