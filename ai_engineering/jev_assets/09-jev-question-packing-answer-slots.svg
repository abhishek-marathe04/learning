<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3d3d3a}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple rect,.c-purple circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7} .c-purple text{fill:#3C3489}.c-teal rect,.c-teal circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56} .c-teal text{fill:#085041}.c-coral rect,.c-coral circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D} .c-coral text{fill:#712B13}.c-gray rect,.c-gray circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A} .c-gray text{fill:#444441}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><title>Question packing with answer slots</title>
<path d="M320 78 Q235 42 160 78" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrowg)"/>
<path d="M450 78 Q300 22 145 78" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrowg)"/>
<path d="M580 78 Q360 2 130 78" fill="none" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrowg)"/>
<g class="c-gray"><rect x="40" y="80" width="200" height="50" rx="6" stroke-width="0.5"/><text class="th" x="140" y="98" text-anchor="middle" dominant-baseline="central">Your data</text><text class="ts" x="140" y="116" text-anchor="middle" dominant-baseline="central">the support ticket</text></g>
<g class="c-teal">
<rect x="260" y="80" width="120" height="50" rx="6" stroke-width="0.5"/><text class="th" x="320" y="98" text-anchor="middle" dominant-baseline="central">Question 1</text><text class="ts" x="320" y="116" text-anchor="middle" dominant-baseline="central">+ answer slot</text>
<rect x="390" y="80" width="120" height="50" rx="6" stroke-width="0.5"/><text class="th" x="450" y="98" text-anchor="middle" dominant-baseline="central">Question 2</text><text class="ts" x="450" y="116" text-anchor="middle" dominant-baseline="central">+ answer slot</text>
<rect x="520" y="80" width="120" height="50" rx="6" stroke-width="0.5"/><text class="th" x="580" y="98" text-anchor="middle" dominant-baseline="central">Question 3</text><text class="ts" x="580" y="116" text-anchor="middle" dominant-baseline="central">+ answer slot</text>
</g>
<line x1="320" y1="130" x2="320" y2="158" class="arr" marker-end="url(#arrow)"/>
<line x1="450" y1="130" x2="450" y2="158" class="arr" marker-end="url(#arrow)"/>
<line x1="580" y1="130" x2="580" y2="158" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal">
<rect x="260" y="160" width="120" height="30" rx="4" stroke-width="1"/><text class="ts" x="320" y="175" text-anchor="middle" dominant-baseline="central">billing 94%</text>
<rect x="390" y="160" width="120" height="30" rx="4" stroke-width="1"/><text class="ts" x="450" y="175" text-anchor="middle" dominant-baseline="central">urgent 71%</text>
<rect x="520" y="160" width="120" height="30" rx="4" stroke-width="1"/><text class="ts" x="580" y="175" text-anchor="middle" dominant-baseline="central">refund? yes 88%</text>
</g>
<text class="ts" x="40" y="226">Curved arrows: every question reads your data. Questions never peek at each other.</text>
<text class="ts" x="40" y="248">All three answers come out of the same single reading pass.</text>
