<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="680" height="230" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3d3d3a}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple rect,.c-purple circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7} .c-purple text{fill:#3C3489}.c-teal rect,.c-teal circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56} .c-teal text{fill:#085041}.c-coral rect,.c-coral circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D} .c-coral text{fill:#712B13}.c-gray rect,.c-gray circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A} .c-gray text{fill:#444441}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><title>Where the time goes</title>
<text class="th" x="40" y="36">Reasoning LLM</text>
<rect class="c-teal" x="40" y="52" width="30" height="36" rx="4" stroke-width="0.5"/>
<g class="c-coral"><rect x="72" y="52" width="416" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="280" y="70" text-anchor="middle" dominant-baseline="central">Thinking words (hidden, hundreds of them)</text></g>
<g class="c-gray"><rect x="490" y="52" width="110" height="36" rx="4" stroke-width="0.5"/><text class="ts" x="545" y="70" text-anchor="middle" dominant-baseline="central">Answer words</text></g>
<text class="th" x="40" y="130">Jev</text>
<rect class="c-teal" x="40" y="146" width="30" height="36" rx="4" stroke-width="0.5"/>
<text class="ts" x="84" y="164" dominant-baseline="central">Read once, done. Nothing else to wait for.</text>
<text class="ts" x="40" y="214">Teal = reading (fast)   Coral = thinking words   Gray = answer words</text>
