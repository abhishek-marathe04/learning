<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3d3d3a}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple rect,.c-purple circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7} .c-purple text{fill:#3C3489}.c-teal rect,.c-teal circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56} .c-teal text{fill:#085041}.c-coral rect,.c-coral circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D} .c-coral text{fill:#712B13}.c-gray rect,.c-gray circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A} .c-gray text{fill:#444441}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><title>One quick look versus thinking step by step</title>
<text class="th" x="170" y="30" text-anchor="middle">Easy question</text>
<line x1="60" y1="150" x2="290" y2="150" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text class="ts" x="210" y="138">Goal</text>
<g class="c-teal"><rect x="100" y="150" width="80" height="60" rx="4" stroke-width="0.5"/><text class="ts" x="140" y="180" text-anchor="middle" dominant-baseline="central">one look</text></g>
<text class="ts" x="140" y="232" text-anchor="middle">Jev reaches it</text>
<text class="th" x="505" y="30" text-anchor="middle">Hard question</text>
<line x1="370" y1="60" x2="640" y2="60" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
<text class="ts" x="370" y="50">Goal</text>
<g class="c-teal"><rect x="380" y="150" width="70" height="60" rx="4" stroke-width="0.5"/><text class="ts" x="415" y="180" text-anchor="middle" dominant-baseline="central">one look</text></g>
<g class="c-coral">
<rect x="480" y="150" width="36" height="60" rx="4" stroke-width="0.5"/>
<rect x="520" y="120" width="36" height="90" rx="4" stroke-width="0.5"/>
<rect x="560" y="90" width="36" height="120" rx="4" stroke-width="0.5"/>
