<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3d3d3a}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple rect,.c-purple circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7} .c-purple text{fill:#3C3489}.c-teal rect,.c-teal circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56} .c-teal text{fill:#085041}.c-coral rect,.c-coral circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D} .c-coral text{fill:#712B13}.c-gray rect,.c-gray circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A} .c-gray text{fill:#444441}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><title>Why writing is slow</title>
<text class="th" x="40" y="34">Reading your prompt (prefill)</text>
<g class="c-purple"><rect x="40" y="50" width="170" height="50" rx="6" stroke-width="0.5"/><text class="th" x="125" y="68" text-anchor="middle" dominant-baseline="central">Model weights</text><text class="ts" x="125" y="86" text-anchor="middle" dominant-baseline="central">stored in memory</text></g>
<line x1="210" y1="75" x2="290" y2="75" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="292" y="50" width="348" height="50" rx="6" stroke-width="0.5"/><text class="th" x="466" y="68" text-anchor="middle" dominant-baseline="central">Process all 1000 words</text><text class="ts" x="466" y="86" text-anchor="middle" dominant-baseline="central">weights carried over once</text></g>
<text class="th" x="40" y="136">Writing the reply (decode)</text>
<g class="c-purple"><rect x="40" y="150" width="170" height="110" rx="6" stroke-width="0.5"/><text class="th" x="125" y="196" text-anchor="middle" dominant-baseline="central">Model weights</text><text class="ts" x="125" y="214" text-anchor="middle" dominant-baseline="central">stored in memory</text></g>
<line x1="210" y1="165" x2="290" y2="165" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="205" x2="290" y2="205" class="arr" marker-end="url(#arrow)"/>
<line x1="210" y1="245" x2="290" y2="245" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral">
<rect x="292" y="150" width="348" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="466" y="165" text-anchor="middle" dominant-baseline="central">Word 1: carry all the weights over</text>
<rect x="292" y="190" width="348" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="466" y="205" text-anchor="middle" dominant-baseline="central">Word 2: carry them all again</text>
<rect x="292" y="230" width="348" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="466" y="245" text-anchor="middle" dominant-baseline="central">Word 3: and again, and again…</text>
</g>
<text class="ts" x="40" y="294">The GPU spends most of its writing time waiting for memory, not calculating.</text>
</svg>
