<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3d3d3a}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple rect,.c-purple circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7} .c-purple text{fill:#3C3489}.c-teal rect,.c-teal circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56} .c-teal text{fill:#085041}.c-coral rect,.c-coral circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D} .c-coral text{fill:#712B13}.c-gray rect,.c-gray circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A} .c-gray text{fill:#444441}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><title>Reading versus writing</title>
<text class="th" x="40" y="30">Reading: all words at once</text>
<g class="c-gray">
<rect x="40" y="50" width="56" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="68" y="65" text-anchor="middle" dominant-baseline="central">my</text>
<rect x="108" y="50" width="56" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="136" y="65" text-anchor="middle" dominant-baseline="central">bill</text>
<rect x="176" y="50" width="56" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="204" y="65" text-anchor="middle" dominant-baseline="central">is</text>
<rect x="244" y="50" width="56" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="272" y="65" text-anchor="middle" dominant-baseline="central">wrong</text>
</g>
<line x1="68" y1="80" x2="68" y2="118" class="arr" marker-end="url(#arrow)"/>
<line x1="136" y1="80" x2="136" y2="118" class="arr" marker-end="url(#arrow)"/>
<line x1="204" y1="80" x2="204" y2="118" class="arr" marker-end="url(#arrow)"/>
<line x1="272" y1="80" x2="272" y2="118" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="120" width="260" height="44" rx="6" stroke-width="0.5"/><text class="th" x="170" y="142" text-anchor="middle" dominant-baseline="central">1 trip for all words</text></g>
<text class="ts" x="40" y="194">Fast: the GPU handles words side by side</text>
<text class="th" x="360" y="30">Writing: one after another</text>
<g class="c-coral">
<rect x="360" y="48" width="120" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="420" y="63" text-anchor="middle" dominant-baseline="central">Trip 1: I</text>
<rect x="400" y="92" width="120" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="460" y="107" text-anchor="middle" dominant-baseline="central">Trip 2: think</text>
<rect x="440" y="136" width="120" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="500" y="151" text-anchor="middle" dominant-baseline="central">Trip 3: this</text>
<rect x="480" y="180" width="120" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="540" y="195" text-anchor="middle" dominant-baseline="central">Trip 4: is</text>
</g>
<line x1="450" y1="78" x2="450" y2="90" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="122" x2="490" y2="134" class="arr" marker-end="url(#arrow)"/>
<line x1="530" y1="166" x2="530" y2="178" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="360" y="236">Slow: each word waits for the one before it</text>
</svg>
