<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#3d3d3a}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple rect,.c-purple circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7} .c-purple text{fill:#3C3489}.c-teal rect,.c-teal circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56} .c-teal text{fill:#085041}.c-coral rect,.c-coral circle,rect.c-coral,circle.c-coral{fill:#FAECE7;stroke:#993C1D} .c-coral text{fill:#712B13}.c-gray rect,.c-gray circle,rect.c-gray,circle.c-gray{fill:#F1EFE8;stroke:#5F5E5A} .c-gray text{fill:#444441}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><title>Calibration</title>
<text class="th" x="40" y="36">Both say "90% sure", ten times</text>
<text class="th" x="40" y="84" dominant-baseline="central">Jev</text>
<g class="c-teal">
<circle cx="160" cy="84" r="10" stroke-width="0.5"/><circle cx="190" cy="84" r="10" stroke-width="0.5"/><circle cx="220" cy="84" r="10" stroke-width="0.5"/><circle cx="250" cy="84" r="10" stroke-width="0.5"/><circle cx="280" cy="84" r="10" stroke-width="0.5"/><circle cx="310" cy="84" r="10" stroke-width="0.5"/><circle cx="340" cy="84" r="10" stroke-width="0.5"/><circle cx="370" cy="84" r="10" stroke-width="0.5"/><circle cx="400" cy="84" r="10" stroke-width="0.5"/>
</g>
<circle class="c-coral" cx="430" cy="84" r="10" stroke-width="0.5"/>
<text class="ts" x="470" y="84" dominant-baseline="central">9 of 10 right: matches</text>
<text class="th" x="40" y="150" dominant-baseline="central">LLM</text>
<g class="c-teal">
<circle cx="160" cy="150" r="10" stroke-width="0.5"/><circle cx="190" cy="150" r="10" stroke-width="0.5"/><circle cx="220" cy="150" r="10" stroke-width="0.5"/><circle cx="250" cy="150" r="10" stroke-width="0.5"/><circle cx="280" cy="150" r="10" stroke-width="0.5"/><circle cx="310" cy="150" r="10" stroke-width="0.5"/><circle cx="340" cy="150" r="10" stroke-width="0.5"/>
</g>
<g class="c-coral">
<circle cx="370" cy="150" r="10" stroke-width="0.5"/><circle cx="400" cy="150" r="10" stroke-width="0.5"/><circle cx="430" cy="150" r="10" stroke-width="0.5"/>
</g>
<text class="ts" x="470" y="150" dominant-baseline="central">7 of 10 right: overconfident</text>
<text class="ts" x="40" y="206">Teal = correct answer.   Coral = wrong answer.</text>
<text class="ts" x="40" y="228">If "90%" really means 90%, your code can safely act on the number.</text>
</svg>
