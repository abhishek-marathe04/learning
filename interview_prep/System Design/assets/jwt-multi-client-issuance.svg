<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 480" role="img">
<title>Multi-client JWT issuance and verification</title>
<desc>Three client types (web SPA, mobile app, service) each authenticate with an auth server via different grant types, receive JWT access tokens scoped to their client, then call an API server which verifies signatures using a shared public key (JWKS) without any per-client special-casing.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- Client tier -->
<g>
<rect x="40" y="30" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="115" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C" font-family="sans-serif">Web SPA</text>
<text x="115" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041" font-family="sans-serif">Auth code + PKCE</text>
</g>

<g>
<rect x="265" y="30" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C" font-family="sans-serif">Mobile app</text>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041" font-family="sans-serif">Auth code + PKCE</text>
</g>

<g>
<rect x="490" y="30" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="565" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C" font-family="sans-serif">Backend service</text>
<text x="565" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041" font-family="sans-serif">Client credentials</text>
</g>

<line x1="115" y1="86" x2="115" y2="130" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="340" y2="130" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="565" y1="86" x2="565" y2="130" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Auth server -->
<g>
<rect x="60" y="130" width="560" height="90" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C" font-family="sans-serif">Auth server (identity provider)</text>
<text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489" font-family="sans-serif">Verifies identity, checks client_id + requested scope</text>
<text x="340" y="190" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489" font-family="sans-serif">Signs JWT with private key, sets aud / scope / client_id claims</text>
</g>

<line x1="340" y1="220" x2="340" y2="264" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="360" y="245" font-size="12" fill="#3d3d3a" font-family="sans-serif">Signed JWT access token</text>

<!-- API server -->
<g>
<rect x="60" y="264" width="560" height="90" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="286" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C" font-family="sans-serif">API server</text>
<text x="340" y="306" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13" font-family="sans-serif">Verifies signature with public key, checks exp / aud / iss</text>
<text x="340" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13" font-family="sans-serif">Authorizes per-request using scope + client_id claims</text>
</g>

<line x1="340" y1="354" x2="340" y2="398" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- JWKS -->
<g>
<rect x="215" y="398" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="418" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">JWKS endpoint</text>
<text x="340" y="436" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441" font-family="sans-serif">Publishes public keys, no shared secret</text>
</g>

<line x1="215" y1="426" x2="60" y2="309" stroke="#73726c" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
</svg>
