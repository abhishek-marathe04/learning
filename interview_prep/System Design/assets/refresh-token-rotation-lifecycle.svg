<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 560" role="img">
<title>Refresh token issuance, rotation, and theft detection lifecycle</title>
<desc>A client logs in and receives an access token and refresh token A, both stored by the auth server. The client uses refresh token A to get a new access token plus refresh token B, invalidating A. If token A is ever presented again after being consumed, the server detects reuse and revokes the entire token family, forcing re-login.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g>
<rect x="20" y="20" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="110" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C" font-family="sans-serif">Login</text>
<text x="110" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041" font-family="sans-serif">Auth server issues tokens</text>
</g>

<line x1="200" y1="48" x2="480" y2="48" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="480" y="20" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="570" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C" font-family="sans-serif">Access token</text>
<text x="570" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489" font-family="sans-serif">JWT, expires ~10 min</text>
</g>

<line x1="110" y1="76" x2="110" y2="120" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="20" y="120" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="110" y="138" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C" font-family="sans-serif">Refresh token A</text>
<text x="110" y="156" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13" font-family="sans-serif">Opaque, stored (hashed) in DB</text>
</g>

<line x1="110" y1="176" x2="110" y2="220" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="130" y="200" font-size="12" fill="#3d3d3a" font-family="sans-serif">Client calls /token with A</text>

<g>
<rect x="20" y="220" width="620" height="70" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="330" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">Auth server: lookup A, validate not revoked / not expired</text>
<text x="330" y="260" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441" font-family="sans-serif">Mark A consumed, issue new access token + refresh token B</text>
<text x="330" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441" font-family="sans-serif">Record B.replaced_from = A</text>
</g>

<line x1="330" y1="290" x2="330" y2="334" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="334" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="330" y="352" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#4A1B0C" font-family="sans-serif">Refresh token B</text>
<text x="330" y="370" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13" font-family="sans-serif">Active, A now dead</text>
</g>

<line x1="330" y1="390" x2="330" y2="434" stroke="#73726c" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="350" y="415" font-size="12" fill="#3d3d3a" font-family="sans-serif">Normal ongoing use</text>

<g>
<rect x="240" y="434" width="180" height="50" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="330" y="454" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C" font-family="sans-serif">Repeats with B → C ...</text>
<text x="330" y="470" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041" font-family="sans-serif">Rotation continues</text>
</g>

<!-- Theft detection branch -->
<line x1="110" y1="148" x2="500" y2="410" stroke="#993C1D" stroke-width="0.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>
<text x="440" y="330" font-size="12" fill="#3d3d3a" font-family="sans-serif">A reused (already consumed)</text>

<g>
<rect x="460" y="420" width="200" height="70" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="560" y="440" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#501313" font-family="sans-serif">Reuse detected</text>
<text x="560" y="458" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">Revoke entire chain A, B, C...</text>
<text x="560" y="474" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">Force full re-login</text>
</g>
</svg>
